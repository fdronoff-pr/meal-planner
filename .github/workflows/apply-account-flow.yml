name: Apply account flow update

on:
  push:
    branches: [main]
    paths: [account-flow.patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply prepared update
        run: |
          git apply account-flow.patch
          rm account-flow.patch .github/workflows/apply-account-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portion.html account-flow.patch .github/workflows/apply-account-flow.yml
          git commit -m "Apply multi-account entry flow"
          git push
