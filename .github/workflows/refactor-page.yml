name: Refactor page structure

on:
  push:
    branches: [main]
    paths: [scripts/refactor-page.js]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Split the self-contained page
        run: |
          node scripts/refactor-page.js
          rm scripts/refactor-page.js .github/workflows/refactor-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portion.html app.js styles.css data/ingredients.js scripts/refactor-page.js .github/workflows/refactor-page.yml
          git commit -m "Split app into maintainable static files"
          git push
